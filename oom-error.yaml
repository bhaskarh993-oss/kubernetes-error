
apiVersion: v1
kind: Pod
metadata:
  name: oom-demo
spec:
  containers:
    - name: memory-demo
      image: polinux/stress
      resources:
        limits:
          memory: "100Mi"
        requests:
           memory: "50Mi"          
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "50M", "--vm-hang", "1"]

